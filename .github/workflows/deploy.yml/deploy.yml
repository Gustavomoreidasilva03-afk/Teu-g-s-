
name: Publicar TEU GAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extrair projeto
        run: unzip -o teu_gas_pwa_primeira_versao.zip -d .

      - name: Instalar dependências
        run: npm install

      - name: Montar aplicativo
        run: npm run build -- --base=/Teu-g-s-/

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar aplicativo
        uses: actions/deploy-pages@v4
