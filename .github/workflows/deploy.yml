
name: Publicar TEU GAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extrair projeto
        run: |
          mkdir app
          unzip teu_gas_pwa_primeira_versao.zip -d app

      - name: Instalar dependências
        working-directory: app
        run: npm install

      - name: Construir aplicativo
        working-directory: app
        run: npm run build -- --base=/Teu-g-s-/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Publicar
        uses: actions/deploy-pages@v4
